services:
  perlite:
    image: sec77/perlite:dev
    container_name: perlite-dev
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - ./perlite/Demo:/var/www/perlite/Demo:ro

  web:
    image: nginx:stable
    container_name: perlite_web
    restart: unless-stopped
    ports:
      - 80:80
    volumes:
      - ./web/config/perlite.conf:/etc/nginx/conf.d/default.conf:ro
    volumes_from: 
      - perlite       
    depends_on:
      - perlite

